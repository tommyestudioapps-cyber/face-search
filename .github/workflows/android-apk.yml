name: Build Android APK (release)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout (com Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS assets
        run: |
          echo "== assets/models =="
          ls -la artifacts/busca-facial-local/assets/models/ || true
          echo "== tamanhos =="
          du -sh artifacts/busca-facial-local/assets/models/* 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT" >&2
            ls -la /usr/local/lib/android/ 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "Using SDKMANAGER=$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (Android)
        working-directory: artifacts/busca-facial-local
        env:
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > artifacts/busca-facial-local/android/app/release.keystore
          ls -la artifacts/busca-facial-local/android/app/release.keystore

      - name: Patch build.gradle for release signing
        run: |
          python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path('artifacts/busca-facial-local/android/app/build.gradle')
          s = p.read_text()

          needle = "        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n"
          if needle not in s:
              raise SystemExit('ERRO: bloco debug signing nao encontrado em build.gradle')
          release_block = needle + "        release {\n            storeFile file('release.keystore')\n            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n        }\n"
          s = s.replace(needle, release_block, 1)

          marker = "release {"
          idx = s.find(marker)
          if idx == -1:
              raise SystemExit('ERRO: bloco release buildType nao encontrado')
          sig_idx = s.find('signingConfig signingConfigs.debug', idx)
          if sig_idx == -1:
              raise SystemExit('ERRO: signingConfig de release nao encontrado')
          s = s[:sig_idx] + 'signingConfig signingConfigs.release' + s[sig_idx + len('signingConfig signingConfigs.debug'):]

          p.write_text(s)
          print('build.gradle patched com sucesso')
          PYEOF

      - name: Show signing sections (debug)
        run: |
          echo "== signingConfigs =="
          grep -A 20 "signingConfigs" artifacts/busca-facial-local/android/app/build.gradle | head -30

      - name: Increase Gradle JVM heap
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF
          cat ~/.gradle/gradle.properties

      - name: Build APK (release, ARM64 only)
        working-directory: artifacts/busca-facial-local/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect APK manifest (foreground service type, target SDK, permissions)
        working-directory: artifacts/busca-facial-local/android
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "APK not found in app/build/outputs/apk/release" >&2
            exit 1
          fi
          echo "== APK encontrado: $APK_PATH"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "aapt2 not found under $SDK_ROOT/build-tools" >&2
            exit 1
          fi
          echo "== Usando $AAPT2"

          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          echo "== APK badging (package and SDK versions)"
          printf '%s\n' "$BADGING" | grep -E "^(package|sdkVersion|targetSdkVersion):"

          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -nE "s/^targetSdkVersion:'([^']+)'.*/\1/p" | head -1)"
          if [ -z "$TARGET_SDK" ]; then
            echo "targetSdkVersion not found in APK badging" >&2
            exit 1
          fi
          echo "== targetSdkVersion confirmado: $TARGET_SDK"

          echo "== Permissões sensíveis presentes no APK"
          PERMISSIONS="$(printf '%s\n' "$BADGING" | grep -E "^uses-permission(-sdk-[0-9]+)?: name='android\.permission\.(FOREGROUND_SERVICE|FOREGROUND_SERVICE_DATA_SYNC|POST_NOTIFICATIONS|WAKE_LOCK|READ_MEDIA_IMAGES|READ_MEDIA_VISUAL_USER_SELECTED|READ_EXTERNAL_STORAGE|CAMERA)" || true)"
          if [ -n "$PERMISSIONS" ]; then
            printf '%s\n' "$PERMISSIONS"
          else
            echo "(nenhuma das permissões selecionadas encontrada)"
          fi

          MANIFEST_XML="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH")"
          SERVICE_DETAILS="$(printf '%s\n' "$MANIFEST_XML" | grep -F -B 5 -A 12 'app.notifee.core.ForegroundService' || true)"
          if [ -z "$SERVICE_DETAILS" ]; then
            echo "Notifee foreground service not found in the packaged APK manifest" >&2
            exit 1
          fi

          SERVICE_TYPE_LINE="$(printf '%s\n' "$SERVICE_DETAILS" | grep -m 1 -F 'android:foregroundServiceType' || true)"
          if [ -z "$SERVICE_TYPE_LINE" ]; then
            echo "android:foregroundServiceType not found for the Notifee service in the packaged APK" >&2
            printf '%s\n' "$SERVICE_DETAILS" >&2
            exit 1
          fi
          echo "== Notifee service and packaged foregroundServiceType"
          printf '%s\n' "$SERVICE_DETAILS" | grep -E 'E: service|app\.notifee\.core\.ForegroundService|android:foregroundServiceType'

          TYPE_MASK_HEX="$(printf '%s\n' "$SERVICE_TYPE_LINE" | sed -nE 's/.*(0x[[:xdigit:]]+)[[:space:]]*$/\1/p')"
          if [ -n "$TYPE_MASK_HEX" ]; then
            TYPE_MASK=$((TYPE_MASK_HEX))
            DECODED_TYPES=""
            if (( TYPE_MASK & 1 )); then
              DECODED_TYPES="dataSync"
            fi
            if (( TYPE_MASK & 2048 )); then
              if [ -n "$DECODED_TYPES" ]; then
                DECODED_TYPES="$DECODED_TYPES, "
              fi
              DECODED_TYPES="${DECODED_TYPES}shortService"
            fi
            if [ -n "$DECODED_TYPES" ]; then
              echo "== foregroundServiceType decodificado: $DECODED_TYPES (mask $TYPE_MASK_HEX)"
            else
              echo "== foregroundServiceType mask não mapeado por esta verificação: $TYPE_MASK_HEX"
            fi
          else
            echo "== foregroundServiceType bruto: $SERVICE_TYPE_LINE"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: search-face-release-apk
          path: artifacts/busca-facial-local/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
