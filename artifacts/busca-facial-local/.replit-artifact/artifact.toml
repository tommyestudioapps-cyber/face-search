kind = "mobile"
previewPath = "/busca-facial-local/"
title = "Busca Facial Local"
description = "Aplicativo mobile privado para encontrar fotos semelhantes na galeria usando processamento local, com onboarding de privacidade, seleção de rosto, análise e resultados."
version = "1.0.0"
id = "artifacts/busca-facial-local"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/busca-facial-local/" ]
localPort = 22595

[services.development]
run = "pnpm --filter @workspace/busca-facial-local run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/busca-facial-local", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/busca-facial-local", "run", "serve" ]

[services.env]
PORT = "22595"
BASE_PATH = "/busca-facial-local/"
